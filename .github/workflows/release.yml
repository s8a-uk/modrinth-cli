name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The only job that may write: it creates the GitHub release (contents) and
    # signs the build provenance of the archives (id-token, attestations).
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # to check that the tag is on main
          persist-credentials: false
      - name: Check the tag
        run: |
          case "$GITHUB_REF_NAME" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "tag $GITHUB_REF_NAME is not vX.Y.Z" >&2; exit 1 ;;
          esac
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "tag $GITHUB_REF_NAME ($GITHUB_SHA) is not on main" >&2
            exit 1
          fi
      - run: make check
      - run: make dist VERSION="${GITHUB_REF_NAME}"
      # scripts/package.sh "${GITHUB_REF_NAME#v}" in the dev container.
      - run: make package VERSION="${GITHUB_REF_NAME}"
      # Build provenance (SLSA) for each archive, stored by GitHub; verify with
      # gh attestation verify <archive> --repo s8a-uk/modrinth-cli.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/release/mdr_*
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          prerelease=
          case "$GITHUB_REF_NAME" in *-*) prerelease=--prerelease ;; esac
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" \
            --generate-notes $prerelease dist/release/mdr_* dist/release/SHA256SUMS
      - run: make down
        if: always()
